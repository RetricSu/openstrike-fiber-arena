name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # rustfmt only parses this crate's own sources, so submodules are
      # not needed here.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Optional path dependencies under vendor/ are resolved for every
      # cargo invocation, so the recursive submodule checkout is required
      # even for default-feature builds.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default features
            args: ""
          # Also covers the matchmaker HTTP integration test, which is
          # gated on the openstrike feature.
          - label: openstrike feature
            args: --features openstrike
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}
      - run: cargo test --locked ${{ matrix.args }}

  build:
    name: build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev
      # Compile-check every binary, including the wgpu/winit desktop client
      # and the asset generators. Debug profile keeps this fast; the desktop
      # binary needs a GPU and display server at runtime, so CI only builds it.
      # Release archives for players are built per platform by release.yml
      # when a version tag is pushed.
      - name: Build all binaries (all features)
        run: cargo build --locked --all-features --bins

  smoke:
    name: headless smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The script asserts on log output with ripgrep, which is not part of
      # the GitHub Ubuntu image.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # Starts a real arena server plus two headless clients on loopback and
      # plays a full mock-payment match to completion.
      - run: ./scripts/smoke-local.sh
